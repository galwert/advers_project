[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-rep"
version = "0.1.0"
description = "Cross-model jailbreak defense via CKA representation repulsion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anonymous (NeurIPS 2026 submission)" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "peft>=0.10",
  "datasets>=2.18",
  "accelerate>=0.29",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "numpy>=1.24",
  "pandas>=2.0",
  "tqdm",
  "pyyaml",
  "huggingface_hub>=0.22",
]

[project.optional-dependencies]
eval = [
  "matplotlib",
  "seaborn",
]
upload = [
  "huggingface_hub>=0.22",
]

[project.scripts]
anchor-rep-train = "anchor_rep.run_with_config:main"

[tool.setuptools.packages.find]
where = ["src"]
